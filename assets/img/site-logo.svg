<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Logo BTS SIO Révision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07120d"/>
      <stop offset="100%" stop-color="#020706"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)" stroke="#0f2e1f" stroke-width="2"/>
  <rect x="23" y="24" width="82" height="62" rx="10" fill="#020806" stroke="url(#line)" stroke-width="4" filter="url(#glow)"/>
  <path d="M24 40h80" stroke="#0f2e1f" stroke-width="2" opacity="0.9"/>
  <circle cx="33" cy="32" r="3.2" fill="#00ff88" opacity="0.9"/>
  <circle cx="43" cy="32" r="3.2" fill="#00d9ff" opacity="0.95"/>
  <circle cx="53" cy="32" r="3.2" fill="#ffb300" opacity="0.9"/>
  <text x="64" y="68" text-anchor="middle" font-family="'Share Tech Mono', 'Orbitron', monospace" font-size="26" font-weight="700" fill="#d7fff0">&lt;/&gt;</text>
  <path d="M38 98h52" stroke="#00ff88" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <text x="64" y="114" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#00ff88" letter-spacing="2">BTS SIO</text>
</svg>